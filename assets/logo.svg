<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 200" width="512" height="200" role="img" aria-label="X-Wide Thought Chain">
  <title>X-Wide Thought Chain</title>
  <desc>六个节点串成一条链，末端是加宽的箭头：先量形状，再动手。</desc>
  <defs>
    <linearGradient id="xw" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7C4DFF"/>
      <stop offset="1" stop-color="#18B4A6"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="512" height="200" rx="20" fill="#101423"/>
  <!-- 链身 -->
  <line x1="58" y1="96" x2="392" y2="96" stroke="url(#xw)" stroke-width="6" stroke-linecap="round"/>
  <!-- 六步节点 -->
  <g fill="#101423" stroke="url(#xw)" stroke-width="4">
    <circle cx="58" cy="96" r="16"/>
    <circle cx="124" cy="96" r="16"/>
    <circle cx="190" cy="96" r="16"/>
    <circle cx="256" cy="96" r="16"/>
    <circle cx="322" cy="96" r="16"/>
    <circle cx="388" cy="96" r="16"/>
  </g>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#EAF0FF" text-anchor="middle">
    <text x="58" y="101">1</text>
    <text x="124" y="101">2</text>
    <text x="190" y="101">3</text>
    <text x="256" y="101">4</text>
    <text x="322" y="101">5</text>
    <text x="388" y="101">6</text>
  </g>
  <!-- 加宽箭头（X-Wide） -->
  <polygon points="404,96 452,74 452,88 494,88 494,104 452,104 452,118" fill="url(#xw)"/>
  <!-- 文字 -->
  <text x="26" y="46" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="27" font-weight="800" fill="#EAF0FF">X-WIDE</text>
  <text x="196" y="46" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#9FB0D8">THOUGHT CHAIN</text>
  <text x="26" y="164" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" fill="#7FE3D6">先量形状，再动手 · 判定器没说 OK 就不算修好</text>
  <text x="404" y="164" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#9FB0D8">v0.1.13</text>
</svg>
